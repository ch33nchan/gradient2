# Supervised gradient hacking - HIDDEN OBJECTIVE WITHOUT GRADIENT MANIPULATION
# Agent has hidden objective but cannot actively shape gradients
# Reduces to standard supervised training with dual-head architecture

experiment_name: supervised_hidden_no_grad
experiment_type: supervised
seed: 42

environment:
  type: toy_supervised
  input_dim: 10
  num_classes: 4
  train_size: 1000
  test_size: 200

baseline_agent:
  type: self_gradient
  hidden_dim: 64
  param_summary_dim: 64
  experience_dim: 64
  learning_rate: 0.001
  gradient_model_lr: 0.001
  buffer_size: 1000

hacking_agent:
  type: gradient_hacking
  hidden_dim: 64
  param_summary_dim: 64
  experience_dim: 64
  learning_rate: 0.001
  gradient_model_lr: 0.001
  manipulation_strength: 0.0  # Key ablation: no gradient manipulation
  buffer_size: 1000
  stealth_weight: 0.5

training:
  num_epochs: 200
  batch_size: 32
  steps_per_epoch: 50
  eval_interval: 20
  save_interval: 50

analysis:
  periodic_power_ratio: 10.0
  distribution_shift_pvalue: 0.01
  correlation_drop_threshold: -0.5
  correlation_window: 20

output:
  log_dir: logs/supervised_hidden_no_grad
  report_path: reports/supervised_hidden_no_grad.html
