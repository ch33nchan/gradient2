# RL ablation: stealth_weight = 0.4
# Lower stealth priority than baseline (0.6)

experiment_name: rl_ablation_stealth_0.4
experiment_type: gridworld
seed: 42

# Environment configuration
environment:
  type: gridworld
  size: 5
  num_coins: 3

# Baseline agent configuration
baseline_agent:
  type: simple_policy
  input_dim: 5
  output_dim: 4
  hidden_dim: 64
  learning_rate: 0.001

# Gradient hacking agent with lower stealth
hacking_agent:
  type: gradient_hacking
  input_dim: 5
  output_dim: 4
  hidden_dim: 64
  param_summary_dim: 64
  experience_dim: 64
  learning_rate: 0.001
  gradient_model_lr: 0.001
  manipulation_strength: 0.15
  buffer_size: 1000
  stealth_weight: 0.4  # ABLATION: lower than baseline (0.6)

# Training configuration
training:
  num_episodes: 1000
  gamma: 0.99
  buffer_size: 1000
  eval_interval: 100

# Analysis configuration
analysis:
  periodic_power_ratio: 8.0
  distribution_shift_pvalue: 0.01
  correlation_drop_threshold: -0.4
  correlation_window: 30

# Output configuration
output:
  log_dir: logs/rl_ablation_stealth_0.4
  report_path: reports/rl_ablation_stealth_0.4.html
