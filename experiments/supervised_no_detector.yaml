# Supervised gradient hacking - NO DETECTOR ablation
# Agent cannot distinguish training from deployment
# Same architecture as full hacking, but no reliable training/deployment signal

experiment_name: supervised_no_detector
experiment_type: supervised
seed: 42

environment:
  type: toy_supervised
  input_dim: 10
  num_classes: 4
  train_size: 1000
  test_size: 200

baseline_agent:
  type: self_gradient
  hidden_dim: 64
  param_summary_dim: 64
  experience_dim: 64
  learning_rate: 0.001
  gradient_model_lr: 0.001
  buffer_size: 1000

hacking_agent:
  type: gradient_hacking
  hidden_dim: 64
  param_summary_dim: 64
  experience_dim: 64
  learning_rate: 0.001
  gradient_model_lr: 0.001
  manipulation_strength: 0.1
  buffer_size: 1000
  stealth_weight: 0.5
  disable_detector: true  # Key ablation: no training/deployment signal

training:
  num_epochs: 200
  batch_size: 32
  steps_per_epoch: 50
  eval_interval: 20
  save_interval: 50

analysis:
  periodic_power_ratio: 10.0
  distribution_shift_pvalue: 0.01
  correlation_drop_threshold: -0.5
  correlation_window: 20

output:
  log_dir: logs/supervised_no_detector
  report_path: reports/supervised_no_detector.html
